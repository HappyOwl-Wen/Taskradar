# Alembic CLI configuration (development use: `alembic revision --autogenerate -m "..."`).
# The application itself runs migrations programmatically on startup (taskradar.db.migrate).
[alembic]
script_location = %(here)s/src/taskradar/migrations
prepend_sys_path = src
# Throwaway development database used only for autogenerate; never the user's real data.
sqlalchemy.url = sqlite:///./.alembic-dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
