[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskradar"
version = "0.4.0"
description = "TaskRadar - a local to-do app for Windows with calendar planning, reminders, focus timers and an optional AI Agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "TaskRadar contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "requests>=2.31",
  "keyring>=25",
  "tzdata>=2024.1",
  # The desktop window (Microsoft Edge WebView2 through pythonnet); the browser version does not need it.
  "pywebview>=6.1; sys_platform == 'win32'",
  # Windows notifications through the Windows API, with a click that brings the window forward (without them
  # TaskRadar sends the same notification through Windows PowerShell).
  "winrt-runtime>=3.1; sys_platform == 'win32'",
  "winrt-Windows.Data.Xml.Dom>=3.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.1; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications>=3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",  # FastAPI's TestClient
  "pillow>=10.4",  # window screenshots of scripts/desktop-check
]
# Packaging TaskRadar.exe (scripts/build-exe.ps1 installs it when missing).
build = [
  "pyinstaller>=6.11",
]

[project.scripts]
taskradar = "taskradar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskradar = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "static/**/*", "desktop/*.ico", "desktop/*.png", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: end-to-end flow through the HTTP API",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "RUF001", # ambiguous unicode chars: we intentionally handle CJK punctuation
  "RUF002",
  "RUF003",
  "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
# Generated by Alembic autogenerate.
"src/taskradar/migrations/versions/*" = ["E501"]
# Multilingual keyword alternations: one regex per line reads better than wrapped fragments.
"src/taskradar/extraction/lexicon.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["taskradar"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
